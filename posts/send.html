<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>enviando</title></head>
<body style="font:16px sans-serif;padding:20px">Enviando imagens…
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const names = (q.get('f') || '').split(',').filter(Boolean);
  const out = [];
  for (const n of names) {
    const r = await fetch('/posts/' + n);
    out.push({ name: n, type: r.headers.get('content-type') || 'image/jpeg', buf: await r.arrayBuffer() });
  }
  const t = window.opener || (window.parent !== window ? window.parent : null);
  if (t) t.postMessage({ mdFiles: out }, 'https://business.facebook.com');
  document.body.textContent = 'Pronto';
  setTimeout(() => window.close(), 300);
})();
</script>
</body></html>
